name: Deploy Pages (release artifact)

# Publishes the PREBUILT site archive from a GitHub Release — no CI build of hugo.
# Deployment is MANUAL ONLY (workflow_dispatch): every run must provide the release
# tag and the archive SHA-256. Pushes to main run the tests workflow, never this one.
# Expected asset name (exact): public-final.tar.gz
# The archive contains public-final/* at its top level; we strip one component.
# Measured locally (site-search-ui-v1): archive 271,549,241 B; extracted raw
# 812,675,950 B (~81% of the 1 GB Pages artifact cap) — the whole job should stay
# far below 10 minutes.
#
# Every release tag owns one archive (the asset is downloaded without --clobber, so an
# already-downloaded release is never overwritten locally); publishing a new archive
# means publishing a NEW tag. Each build of the archive restores static/ from git HEAD
# (scripts/archive_final.py --static-source head) and this workflow re-checks the same
# files by SHA-256 after extraction, failing the deploy on any mismatch.
#
# Usage:
#   - Actions → "Deploy Pages (release artifact)" → "Run workflow".
#   - Provide the release tag and the expected SHA-256 of public-final.tar.gz.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag that carries public-final.tar.gz"
        required: true
      expected_sha256:
        description: "SHA-256 of public-final.tar.gz (required; deploy fails on mismatch)"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # Static assets that must match the repository exactly (verified twice: by
  # scripts/archive_final.py at pack time and here after extraction).
  # Format: <path inside the archive>=<path in the repository>.
  # Hugo copies static/* to the site root, so the archive layout has css/ and js/.
  STATIC_FILES: |
    css/style.css=static/css/style.css
    js/search.js=static/js/search.js

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository (for the static-asset comparison)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download site archive from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG_INPUT:-}"
          test -n "$TAG" || { echo "::error::tag is required"; exit 1; }
          echo "Using release tag: $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # No --clobber: a tag's asset is downloaded once and stays untouched.
          gh release download "$TAG" --repo "${{ github.repository }}" \
            --pattern "public-final.tar.gz"
          # Keep a tag-based name locally so several archives can be inspected side by side.
          mv public-final.tar.gz "public-final-${TAG}.tar.gz"
          test -s "public-final-${TAG}.tar.gz" || { echo "asset missing"; exit 1; }

      - name: Verify archive checksum
        env:
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          test -n "${EXPECTED_SHA256:-}" || { echo "::error::expected_sha256 is required"; exit 1; }
          ACTUAL=$(sha256sum "public-final-${TAG}.tar.gz" | cut -d" " -f1)
          echo "actual:   $ACTUAL"
          echo "release:  $TAG"
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "::error::SHA-256 mismatch (expected $EXPECTED_SHA256)"; exit 1
          fi

      - name: Reject unsafe archive members
        run: |
          set -euo pipefail
          # Refuse path traversal, absolute paths, links, and special entries
          # before anything is written outside the extraction directory.
          python3 - "public-final-${TAG}.tar.gz" <<'PY'
          import sys
          import tarfile

          archive = sys.argv[1]
          bad = []
          with tarfile.open(archive, mode="r|gz") as tf:
              for member in tf:
                  name = member.name
                  if name.startswith("/") or ".." in name.split("/"):
                      bad.append(f"unsafe path: {name}")
                  if not (member.isfile() or member.isdir()):
                      if member.issym():
                          kind = "symlink"
                      elif member.islnk():
                          kind = "hardlink"
                      else:
                          kind = "special entry"
                      target = f" -> {member.linkname}" if member.linkname else ""
                      bad.append(f"{kind}: {name}{target}")
          for line in bad[:50]:
              print(f"::error::{line}")
          if bad:
              print(f"::error::{len(bad)} unsafe archive member(s); refusing to extract")
              sys.exit(1)
          PY

      - name: Extract archive
        run: |
          set -euo pipefail
          mkdir -p site
          tar -xzf "public-final-${TAG}.tar.gz" -C site --strip-components=1
          test -f site/index.html || test -d site/poem || { echo "unexpected layout"; exit 1; }

      - name: Verify static assets match repository HEAD
        run: |
          set -euo pipefail
          # The archive must ship the same static assets as the commit being deployed;
          # a stale archive (built from an older HEAD) fails here instead of going live.
          status=0
          while IFS= read -r pair; do
            [ -n "$pair" ] || continue
            archive_rel="${pair%%=*}"
            repo_rel="${pair#*=}"
            ARCHIVE_SHA=$(sha256sum "site/$archive_rel" | cut -d" " -f1)
            REPO_SHA=$(sha256sum "$repo_rel" | cut -d" " -f1)
            if [ "$ARCHIVE_SHA" = "$REPO_SHA" ]; then
              echo "OK   $archive_rel <- $repo_rel $REPO_SHA"
            else
              echo "::error::$archive_rel mismatch — archive $ARCHIVE_SHA vs repository $repo_rel $REPO_SHA (release $TAG is stale)"
              status=1
            fi
          done <<< "$STATIC_FILES"
          exit "$status"

      - name: Freeze config pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
